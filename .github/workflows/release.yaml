# Release: push to `dev` -> build the multi-arch image -> only then commit to `main`,
# tag v<version> and create the GitHub release. `main` is written by this workflow only,
# so Home Assistant never sees an update whose image is not on GHCR yet.
# A push without a version bump does nothing (that version is already released).
# Can also be started by hand: Actions -> Release -> Run workflow.
name: Release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          version=$(python3 .github/scripts/set_channel.py version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::notice::v${version} is already released - nothing to do (bump the version to release)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Switch files to the stable channel
        if: steps.v.outputs.skip != 'true'
        run: python3 .github/scripts/set_channel.py apply stable

      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip != 'true'
      - uses: docker/login-action@v3
        if: steps.v.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer cache (npm ci / pip install) is reused until package-lock.json or
      # requirements.txt change, so a normal code change only rebuilds the app layers.
      - name: Build and push image
        if: steps.v.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: smart_scheduler
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/thaihoang987/smart-scheduler:${{ steps.v.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Smart Scheduler Home Assistant add-on

      - name: Commit to main, tag and create the release (image is ready)
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/release && cp -a . /tmp/release/ && rm -rf /tmp/release/.git
          git fetch origin main
          # -f: set_channel.py modified config.yaml on the dev tree (full copy is already in /tmp/release)
          git checkout -f -B main origin/main
          git rm -rq --ignore-unmatch .
          cp -a /tmp/release/. .
          git add -A
          git commit -m "Release ${VERSION}"
          git tag "v${VERSION}"
          git push origin main "v${VERSION}"
          python3 - <<'PY' > /tmp/notes.md
          import os, re
          text = open("smart_scheduler/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(os.environ['VERSION'])}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "See CHANGELOG.md")
          PY
          gh release create "v${VERSION}" --title "Smart Scheduler ${VERSION}" --notes-file /tmp/notes.md
